# 프로젝트 1 graph 초안 — 매일 아침 AI 기업 소식 블로그
# 단계가 쓸 프롬프트(prompts/)와 스크립트(steps/)는 아직 없어서, 이 판은 실행하지 않는다.
# ① 매일 아침 저절로 · 같은 날 두 번 X → graph 밖에서 GitHub Actions 가 runner 를 부른다

start: collect
max_attempts: 3              # ④ 다시 쓰되 세 번까지 — 넘으면 human queue
backoff_seconds: 2
retry_prompt: "앞 결과가 거부된 이유: {reason}. 이 이유만 고치세요."

steps:
  collect:                   # ② 웹서치로 새 글을 찾고 원문 · 주소 · 게시일 · 가져온 시각을 남긴다
    claude: prompts/collect.md
    output: sources.json
    next: count
  count:                     # ⑥ 새 글 0건 → exit code 4 로 끝 · 수집 실패 → 거부해 collect 다시
    run: python steps/count.py sources.json
    next: write
    on_reject: collect
  write:                     # ⑦ CLAUDE.md 의 독자 · 말투로 초안을 쓴다
    claude: prompts/write.md
    needs: [sources.json]
    output: draft.md
    next: check
  check:                     # ③ 숫자 · 인용이 원문과 같은지 대조한다
    run: python steps/check.py draft.md
    next: approve
    on_reject: write
  approve:                   # ⑤ PR 을 열고 내 승인을 기다린다 → exit code 3
    run: python steps/approve.py draft.md
    next: end
# 게시는 graph 밖 — 내가 PR 을 합치면 GitHub Pages 가 docs/ 를 올린다
